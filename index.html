<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />

    <!-- ==============================
         VIEWPORT
    =============================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />


    <!-- ==============================
         FAVICON
    =============================== -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="shortcut icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />


    <!-- ==============================
         PAGE TITLE
    =============================== -->
    <title>
      Apex Road Network | Traffic Engineering Sydney
    </title>


    <!-- ==============================
         SEO DESCRIPTION
    =============================== -->
    <meta
      name="description"
      content="Apex Road Network provides traffic engineering, traffic management planning and transport solutions for civil, construction and infrastructure projects across Sydney, NSW and Australia."
    />


    <!-- ==============================
         SEO KEYWORDS
    =============================== -->
    <meta
      name="keywords"
      content="Apex Road Network, traffic engineering Sydney, traffic management Sydney, traffic management plans, transport planning, traffic engineering NSW, construction traffic management, traffic staging design"
    />


    <!-- ==============================
         GENERAL SEO
    =============================== -->
    <meta
      name="author"
      content="Apex Road Network"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://www.apexroadnetwork.com.au/"
    />


    <!-- ==============================
         OPEN GRAPH
         WhatsApp / Facebook / LinkedIn
    =============================== -->
    <meta
      property="og:title"
      content="Apex Road Network | Traffic Engineering Sydney"
    />

    <meta
      property="og:description"
      content="Traffic engineering and traffic management solutions for civil, construction and infrastructure projects across Sydney, NSW and Australia."
    />

    <meta
      property="og:url"
      content="https://www.apexroadnetwork.com.au/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Apex Road Network"
    />

    <meta
      property="og:image"
      content="https://www.apexroadnetwork.com.au/apex-nav-logo2.png"
    />

    <meta
      property="og:image:alt"
      content="Apex Road Network"
    />


    <!-- ==============================
         TWITTER / X
    =============================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Apex Road Network | Traffic Engineering Sydney"
    />

    <meta
      name="twitter:description"
      content="Traffic engineering and traffic management solutions across Sydney, NSW and Australia."
    />

    <meta
      name="twitter:image"
      content="https://www.apexroadnetwork.com.au/apex-nav-logo2.png"
    />


    <!-- ==============================
         THEME COLOUR
    =============================== -->
    <meta
      name="theme-color"
      content="#0d1317"
    />

  </head>
